[versions]
# AtlantaFX 3.0.0 is built against JavaFX 27 (it calls Interpolator.ofSpline, added after 25).
javafx = "27"
atlantafx = "3.0.0"
ikonli = "12.4.0"
sqlite = "3.53.4.0"
jdbi = "3.55.0"
lucene = "10.5.2"
pdfbox = "3.0.8"
jbig2 = "3.0.4"
jai-imageio = "1.4.0"
jackson = "2.22.4"
commonmark = "0.31.0"
slf4j = "2.0.20"
logback = "1.6.6"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
testfx = "4.0.18"
hamcrest = "3.0"

[libraries]
# UI (JavaFX artifacts need an OS classifier; see app/build.gradle.kts)
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }
javafx-media = { module = "org.openjfx:javafx-media", version.ref = "javafx" }
atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-feather = { module = "org.kordamp.ikonli:ikonli-feather-pack", version.ref = "ikonli" }
ikonli-materialdesign2 = { module = "org.kordamp.ikonli:ikonli-materialdesign2-pack", version.ref = "ikonli" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }

# Storage
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-sqlite = { module = "org.jdbi:jdbi3-sqlite", version.ref = "jdbi" }

# Search
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }

# PDF
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# Image decoders PDFBox finds through ImageIO: JBIG2 (scanned pages) and JPEG 2000 (JPX).
# jai-imageio-jpeg2000 is BSD-3-Clause plus the JJ2000 licence: ship its notice with the app.
pdfbox-jbig2 = { module = "org.apache.pdfbox:jbig2-imageio", version.ref = "jbig2" }
jai-imageio-jpeg2000 = { module = "com.github.jai-imageio:jai-imageio-jpeg2000", version.ref = "jai-imageio" }

# JSON
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Tests
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
# TestFX robot methods take Hamcrest matchers, so compiling calls to them needs it.
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[bundles]
lucene = ["lucene-core", "lucene-queryparser", "lucene-analysis-common"]
jackson = ["jackson-databind", "jackson-jsr310"]
jdbi = ["jdbi-core", "jdbi-sqlite"]
ikonli = ["ikonli-javafx", "ikonli-feather", "ikonli-materialdesign2"]
