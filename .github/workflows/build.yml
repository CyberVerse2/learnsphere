# Builds and tests LearnSphere on macOS and Windows, then builds the Windows installer with llama.cpp and
# the models bundled. packaging/README.md describes the installers and the release steps.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ runner.os }}
          path: '*/build/reports/tests/'
          retention-days: 7

  # The installer bundles about 3.6 GB of models, so it is built for pushes, tags and manual runs, not for
  # every pull request.
  windows-installer:
    name: Windows installer
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # jpackage builds the .msi with WiX 4 or later and its Util and UI extensions.
      - name: Install the WiX Toolset
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version 5.0.2 --tool-path $tools
          & "$tools\wix.exe" extension add --global WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          & "$tools\wix.exe" --version
          Add-Content -Path $env:GITHUB_PATH -Value $tools

      # llama.cpp b11550 for Windows (Vulkan, x64) and the models, as pinned in packaging/runtime.lock.
      - name: Restore llama.cpp and the models
        id: runtime-cache
        uses: actions/cache@v6
        with:
          path: runtime
          key: runtime-windows-x64-${{ hashFiles('packaging/runtime.lock', 'packaging/windows/fetch-runtime.ps1') }}

      - name: Download llama.cpp and the models
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/windows/fetch-runtime.ps1 -Destination runtime

      - name: Show free disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

      # A tag such as v1.2.0 sets the installer version; other builds use the default version.
      - name: Build the installer
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=("-Plearnsphere.packageVersion=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew --console=plain :app:packageWindows "${args[@]}"

      # The installer keeps the models in cabinet files next to the .msi; both are needed to install.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: LearnSphere-windows-x64
          path: |
            app/build/package/*.msi
            app/build/package/*.cab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
